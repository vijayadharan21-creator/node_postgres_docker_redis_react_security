services:
  server:
    build:
      context: './server'
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      
      host: postgres
      port: 5432
      user: admin
      password: password
      database: demo
      PORT: 5000
    depends_on:
      - postgres
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
   
volumes:
  postgres_data: